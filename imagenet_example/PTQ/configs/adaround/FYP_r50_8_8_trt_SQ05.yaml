extra_prepare_dict:
    extra_qconfig_dict:
        w_observer: MSEObserver
        a_observer: EMAMSEObserver
        w_fakequantize: AdaRoundFakeQuantize
        a_fakequantize: FixedFakeQuantize
        w_qscheme:
            bit: 8
            symmetry: True
            per_channel: True
            pot_scale: False
            p: 2.4
        a_qscheme:
            bit: 8
            symmetry: True
            per_channel: False
            pot_scale: False
            p: 2.4
quantize:
    smoothquant:
        enabled: true
        alpha: 0.5
    backend: 'Tensorrt'
    quantize_type: advanced_ptq
    cali_batchsize: 16
    reconstruction:
        pattern: layer
        scale_lr: 4.0e-5
        warm_up: 0.2
        weight: 0.01
        max_count: 20000
        b_range: [20,2]
        keep_gpu: True
        round_mode: learned_hard_sigmoid
        prob: 1.0
    deploy:
        output_path: /home/users/ntu/sooq0001
        model_name: 'res50_8_8_SQ05'
        deploy_to_qlinear: False
model:
    type: resnet50
    kwargs:
        num_classes: 1000
    path: /home/users/ntu/sooq0001/mydir/resnet50_imagenet.pth.tar
data:
    path: /home/users/ntu/sooq0001/scratch/ImageNet-ILSVRC2012/
    batch_size: 64
    num_workers: 4
    pin_memory: True
    input_size: 224
    test_resize: 256
process:
    seed: 89
